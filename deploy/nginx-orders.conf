# Merge into the existing HTTPS server block, before its static fallback.
location = /api/orders {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
}
# Defense in depth: application source and credentials are not public assets.
location ~ ^/(server|shared|tests|scripts|deploy|src|node_modules)(/|$) { return 404; }
location ~ (^|/)\.(env|git)(/|$|\.) { return 404; }
