stages:
  - deploy
  - verify
  - promote

variables:
  DEPLOY_PATH: /var/www/mysite

# --- 1. Деплой на VM при пуше в develop ---
deploy_to_vm:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
  script:
    - rsync -avz --delete
        --exclude '.git'
        --exclude '.gitlab-ci.yml'
        ./ "$VM_USER@$VM_HOST:$DEPLOY_PATH/"

# --- 2. Проверка, что сайт поднялся ---
health_check:
  stage: verify
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  needs: [deploy_to_vm]
  script:
    - apk add --no-cache curl
    - |
      for i in $(seq 1 10); do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" || echo "000")
        echo "Попытка $i: HTTP $STATUS"
        if [ "$STATUS" = "200" ]; then
          echo "✅ Сайт живой"
          exit 0
        fi
        sleep 5
      done
      echo "❌ Сайт не отвечает"
      exit 1

# --- 3. Автомерж develop -> main после успешной проверки ---
promote_to_main:
  stage: promote
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  needs: [health_check]
  script:
    - apk add --no-cache git
    - git config --global user.email "ci@gitlab"
    - git config --global user.name "GitLab CI"
    - git clone "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" repo
    - cd repo
    - git checkout main
    - git merge origin/develop --no-edit
    - git push origin main