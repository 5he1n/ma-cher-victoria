stages:
  - check
  - deploy
  - verify

variables:
  DEPLOY_PATH: /var/www/mysite

check:
  stage: check
  image: node:22-bookworm
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.25.0 --activate
    - pnpm install --frozen-lockfile
    - pnpm exec playwright install --with-deps chromium
  script:
    - pnpm check
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - index.html
      - 404.html
      - ru/
      - en/
      - css/
      - js/
      - media/
      - artifacts/logs/
      - artifacts/screenshots/

# --- 1. Деплой на VM при обновлении main ---
deploy_to_vm:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - job: check
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
  script:
    - rsync -avz --delete
        --exclude '.git'
        --exclude '.gitlab-ci.yml'
        --exclude '.env*'
        --exclude 'node_modules'
        --exclude 'server'
        --exclude 'shared'
        --exclude 'tests'
        --exclude 'scripts'
        --exclude 'deploy'
        --exclude 'src'
        --exclude 'package*.json'
        --exclude 'pnpm-lock.yaml'
        --exclude 'artifacts'
        --exclude 'test-results'
        --exclude '.venv'
        ./ "$VM_USER@$VM_HOST:$DEPLOY_PATH/"

# --- 2. Проверка, что сайт поднялся ---
health_check:
  stage: verify
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs: [deploy_to_vm]
  script:
    - apk add --no-cache curl
    - |
      for i in $(seq 1 10); do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" || echo "000")
        echo "Попытка $i: HTTP $STATUS"
        if [ "$STATUS" = "200" ]; then
          echo "✅ Сайт живой"
          exit 0
        fi
        sleep 5
      done
      echo "❌ Сайт не отвечает"
      exit 1
