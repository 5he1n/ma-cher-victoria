<section class="page-section section-wall">
  <div class="wall-inner">
    <header class="shop-heading">
      <h1>{{i18n.shop.title}}</h1>
      <p class="section-intro">{{i18n.shop.intro}}</p>
    </header>
    <div class="filters" id="shopFilters" aria-label="{{i18n.shop.title}}">
      <button class="tab-btn active" type="button" data-filter="all">{{i18n.shop.filters.all}}</button>
      <button class="tab-btn" type="button" data-filter="original">{{i18n.shop.filters.original}}</button>
      <button class="tab-btn" type="button" data-filter="print">{{i18n.shop.filters.print}}</button>
    </div>
    <div class="wall" id="shopWall"></div>
    <div class="wall-terms">
      <p class="shop-note"><strong>{{i18n.shop.terms.shippingLabel}}</strong> {{i18n.shop.terms.shipping}}</p>
      <p class="shop-note"><strong>{{i18n.shop.terms.timingLabel}}</strong> {{i18n.shop.terms.timing}}</p>
      <p class="shop-note"><strong>{{i18n.shop.terms.paymentLabel}}</strong> {{i18n.shop.terms.payment}}</p>
    </div>
  </div>
</section>
